  <line x1="390" y1="200" x2="480" y2="140" stroke="url(#blueGlow)" stroke-width="1" opacity="0.3"/>
  <line x1="170" y1="320" x2="80" y2="360" stroke="url(#cyanGlow)" stroke-width="1" opacity="0.3"/>
  <line x1="390" y1="300" x2="480" y2="380" stroke="url(#blueGlow)" stroke-width="1" opacity="0.3"/>

  <!-- Scanning line effect on rack -->
  <rect x="178" y="130" width="204" height="3" rx="1" fill="url(#blueGlow)" opacity="0.15">
    <animate attributeName="y" from="130" to="450" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.2;0.2;0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Small floating particles -->
  <circle cx="140" cy="240" r="2" fill="#06B6D4" opacity="0.5">
    <animate attributeName="cy" values="240;230;240" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="425" cy="260" r="2" fill="#06b6d4" opacity="0.5">
    <animate attributeName="cy" values="260;250;260" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
