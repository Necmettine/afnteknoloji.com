    <rect x="228" y="272" width="8" height="10" rx="1"/>
    <rect x="240" y="272" width="8" height="10" rx="1"/>
    <rect x="252" y="272" width="8" height="10" rx="1"/>
    <rect x="264" y="272" width="8" height="10" rx="1"/>
    <rect x="276" y="272" width="8" height="10" rx="1"/>
