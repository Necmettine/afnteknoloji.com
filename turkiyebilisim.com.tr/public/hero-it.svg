  <circle cx="333" cy="194" r="3" fill="#22c55e" filter="url(#glow)" opacity="0.9"/>
  <circle cx="344" cy="194" r="3" fill="#f59e0b" filter="url(#glow)" opacity="0.9"/>
  <circle cx="355" cy="200" r="7" fill="#1e293b" stroke="#2d4a6b" stroke-width="1"/>
  <circle cx="355" cy="200" r="4" fill="#22c55e" opacity="0.6"/>
  <rect x="318" y="202" width="52" height="2" rx="1" fill="#22c55e" opacity="0.4"/>
  <rect x="318" y="202" width="44" height="2" rx="1" fill="#22c55e" filter="url(#glow)"/>

  <!-- Server 3 -->
  <rect x="186" y="224" width="188" height="36" rx="3" fill="#1e293b" stroke="#2d4a6b" stroke-width="1"/>
  <rect x="190" y="228" width="120" height="28" rx="2" fill="#0f172a"/>
  <rect x="194" y="234" width="20" height="16" rx="1" fill="#1a2744"/>
  <rect x="218" y="234" width="20" height="16" rx="1" fill="#1a2744"/>
  <rect x="242" y="234" width="20" height="16" rx="1" fill="#152038"/>
  <rect x="266" y="234" width="20" height="16" rx="1" fill="#1a2744"/>
