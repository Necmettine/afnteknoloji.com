  <circle cx="394" cy="504" r="3" fill="#22c55e" opacity="0.8"/>
  <circle cx="408" cy="504" r="3" fill="#22c55e" opacity="0.8"/>
  <text x="422" y="508" fill="#334155" font-size="7" font-family="monospace">7/24</text>
