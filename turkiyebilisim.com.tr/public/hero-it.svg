  <rect x="218" y="150" width="20" height="16" rx="1" fill="#1a2744"/>
  <rect x="242" y="150" width="20" height="16" rx="1" fill="#1a2744"/>
  <rect x="266" y="150" width="20" height="16" rx="1" fill="#152038"/>
  <rect x="290" y="150" width="20" height="16" rx="1" fill="#1a2744"/>
