<svg viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="280" cy="280" r="240" fill="url(#bgGlow)"/>

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#06B6D4" stroke-width="0.5">
    <line x1="80" y1="100" x2="480" y2="100"/><line x1="80" y1="150" x2="480" y2="150"/>
    <line x1="80" y1="200" x2="480" y2="200"/><line x1="80" y1="250" x2="480" y2="250"/>
    <line x1="80" y1="300" x2="480" y2="300"/><line x1="80" y1="350" x2="480" y2="350"/>
    <line x1="80" y1="400" x2="480" y2="400"/><line x1="80" y1="450" x2="480" y2="450"/>
    <line x1="100" y1="80" x2="100" y2="480"/><line x1="150" y1="80" x2="150" y2="480"/>
    <line x1="200" y1="80" x2="200" y2="480"/><line x1="250" y1="80" x2="250" y2="480"/>
    <line x1="300" y1="80" x2="300" y2="480"/><line x1="350" y1="80" x2="350" y2="480"/>
    <line x1="400" y1="80" x2="400" y2="480"/><line x1="450" y1="80" x2="450" y2="480"/>
