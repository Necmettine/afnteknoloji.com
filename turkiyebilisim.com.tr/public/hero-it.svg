  <!-- Server 2 -->
  <rect x="186" y="182" width="188" height="36" rx="3" fill="#1e293b" stroke="#2d4a6b" stroke-width="1"/>
  <rect x="190" y="186" width="120" height="28" rx="2" fill="#0f172a"/>
  <rect x="194" y="192" width="20" height="16" rx="1" fill="#1a2744"/>
  <rect x="218" y="192" width="20" height="16" rx="1" fill="#1a2744"/>
  <rect x="242" y="192" width="20" height="16" rx="1" fill="#1a2744"/>
  <rect x="266" y="192" width="20" height="16" rx="1" fill="#1a2744"/>
  <rect x="290" y="192" width="20" height="16" rx="1" fill="#1a2744"/>
