  <circle cx="127" cy="374" r="2" fill="#06b6d4" opacity="0.8"/>

  <!-- Node 4 - bottom right (Network) -->
  <g filter="url(#softGlow)">
    <circle cx="455" cy="370" r="22" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="455" cy="370" r="16" fill="#0a1020" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.3"/>
