  <text x="280" y="355" text-anchor="middle" fill="#475569" font-size="7" font-family="monospace" letter-spacing="2">UPS POWER</text>
  <!-- Battery bars -->
  <rect x="200" y="360" width="160" height="14" rx="2" fill="#0f172a" stroke="#1e3a5f" stroke-width="0.5"/>
  <rect x="202" y="362" width="132" height="10" rx="1" fill="#06B6D4" opacity="0.7" filter="url(#glow)"/>
  <text x="374" y="370" text-anchor="middle" fill="#06B6D4" font-size="7" font-family="monospace">84%</text>

  <!-- Firewall Device -->
  <rect x="186" y="394" width="188" height="24" rx="3" fill="#1a1230" stroke="#3d2a7a" stroke-width="1"/>
  <text x="220" y="408" fill="#7c3aed" font-size="6" font-family="monospace" letter-spacing="1">FIREWALL</text>
  <circle cx="340" cy="406" r="3" fill="#7c3aed" filter="url(#glow)"/>
  <circle cx="352" cy="406" r="3" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="364" cy="406" r="3" fill="#22c55e" filter="url(#glow)"/>
  <!-- Firewall shield icon -->
  <path d="M310 400 L310 412 C310 412 316 415 316 412 L316 400 Z" fill="none" stroke="#7c3aed" stroke-width="1.2" filter="url(#glow)"/>

  <!-- Empty slots -->
  <rect x="186" y="424" width="188" height="14" rx="2" fill="#0a1020" stroke="#1a2030" stroke-width="0.5"/>
  <rect x="186" y="442" width="188" height="8" rx="2" fill="#080d18" stroke="#141e2e" stroke-width="0.5"/>

  <!-- Cable Management Panel -->
  <rect x="178" y="456" width="204" height="14" rx="3" fill="#0a0f1f" stroke="#1e3a5f" stroke-width="1"/>
  <g fill="#1e3a5f">
    <rect x="184" y="459" width="4" height="8" rx="1"/>
    <rect x="192" y="459" width="4" height="8" rx="1"/>
    <rect x="200" y="459" width="4" height="8" rx="1"/>
    <rect x="208" y="459" width="4" height="8" rx="1"/>
    <rect x="216" y="459" width="4" height="8" rx="1"/>
    <rect x="224" y="459" width="4" height="8" rx="1"/>
    <rect x="232" y="459" width="4" height="8" rx="1"/>
    <rect x="240" y="459" width="4" height="8" rx="1"/>
    <rect x="248" y="459" width="4" height="8" rx="1"/>
    <rect x="256" y="459" width="4" height="8" rx="1"/>
    <rect x="264" y="459" width="4" height="8" rx="1"/>
    <rect x="272" y="459" width="4" height="8" rx="1"/>
    <rect x="280" y="459" width="4" height="8" rx="1"/>
    <rect x="288" y="459" width="4" height="8" rx="1"/>
    <rect x="296" y="459" width="4" height="8" rx="1"/>
    <rect x="304" y="459" width="4" height="8" rx="1"/>
    <rect x="312" y="459" width="4" height="8" rx="1"/>
    <rect x="320" y="459" width="4" height="8" rx="1"/>
    <rect x="328" y="459" width="4" height="8" rx="1"/>
    <rect x="336" y="459" width="4" height="8" rx="1"/>
    <rect x="344" y="459" width="4" height="8" rx="1"/>
    <rect x="352" y="459" width="4" height="8" rx="1"/>
    <rect x="360" y="459" width="4" height="8" rx="1"/>
    <rect x="368" y="459" width="4" height="8" rx="1"/>
  </g>

  <!-- Cabinet legs -->
  <rect x="185" y="460" width="16" height="16" rx="2" fill="#0f172a"/>
  <rect x="359" y="460" width="16" height="16" rx="2" fill="#0f172a"/>

  <!-- Floating nodes around rack -->
  <!-- Node 1 - top left -->
  <g filter="url(#softGlow)">
    <circle cx="110" cy="180" r="22" fill="#0f172a" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="110" cy="180" r="16" fill="#0a1020" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.3"/>
    <!-- CPU icon -->
    <rect x="103" y="173" width="14" height="14" rx="1" fill="none" stroke="#06B6D4" stroke-width="1.2"/>
    <rect x="106" y="176" width="8" height="8" rx="0.5" fill="#06B6D4" opacity="0.5"/>
    <!-- CPU pins -->
    <line x1="105" y1="170" x2="105" y2="173" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="110" y1="170" x2="110" y2="173" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="115" y1="170" x2="115" y2="173" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="105" y1="187" x2="105" y2="190" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="110" y1="187" x2="110" y2="190" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="115" y1="187" x2="115" y2="190" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="100" y1="175" x2="103" y2="175" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="100" y1="180" x2="103" y2="180" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="100" y1="185" x2="103" y2="185" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="117" y1="175" x2="120" y2="175" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="117" y1="180" x2="120" y2="180" stroke="#06B6D4" stroke-width="0.8"/>
    <line x1="117" y1="185" x2="120" y2="185" stroke="#06B6D4" stroke-width="0.8"/>
  </g>
  <!-- Connection line node1 to rack -->
  <line x1="132" y1="180" x2="170" y2="195" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="132" cy="180" r="2" fill="#06B6D4" opacity="0.8"/>

  <!-- Node 2 - top right (Shield) -->
  <g filter="url(#softGlow)">
    <circle cx="450" cy="160" r="22" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="450" cy="160" r="16" fill="#0a1020" stroke="#7c3aed" stroke-width="0.5" stroke-opacity="0.3"/>
    <!-- Shield icon -->
    <path d="M450 148 L443 152 L443 162 C443 167 450 171 450 171 C450 171 457 167 457 162 L457 152 Z" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <path d="M447 161 L449 163 L453 158" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Connection line node2 to rack -->
  <line x1="428" y1="160" x2="390" y2="185" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="428" cy="160" r="2" fill="#7c3aed" opacity="0.8"/>

  <!-- Node 3 - bottom left (Cloud) -->
  <g filter="url(#softGlow)">
    <circle cx="105" cy="380" r="22" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="105" cy="380" r="16" fill="#0a1020" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.3"/>
